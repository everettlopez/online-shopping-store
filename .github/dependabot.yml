# Weekly pull requests that update dependencies. Minor and patch updates are grouped
# into one PR per ecosystem; each major upgrade gets a PR of its own, so one breaking
# change can't hold back the safe updates. CI runs the tests and builds on each; read
# the changelog before merging a major.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # SQLModel 0.0.48 (and the SQLAlchemy 2.1 it brings) require timezone-aware
    # datetimes, and the app stores naive UTC ones. Lift this with that migration
    ignore:
      - dependency-name: "sqlmodel"
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet; lift this when it does
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Matches the Node version the storefront builds with (24, the LTS release)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Font Awesome 7 changes icon sizes and widths; move to it deliberately and
      # check every page's icons
      - dependency-name: "@fortawesome/fontawesome-free"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
    # A new major Node or Python image is a deliberate upgrade (odd-numbered Node
    # releases are never long-term support), not a weekly bump
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    # MySQL's version numbers jump between release series (8.4 LTS to 9.x innovation
    # releases and later); moving the database to a new series is a planned upgrade
    ignore:
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
