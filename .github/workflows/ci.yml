name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No database, .env or network needed: tests use in-memory SQLite and mock Stripe
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Also the type check (tsc -b)
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t shop-api .
      - run: docker build --build-arg VITE_API_URL=https://api.example.com/api -t shop-web frontend
      # The production stack's compose file and Caddyfile parse with the example settings
      - run: cp deploy/.env.example deploy/.env && touch deploy/.env.api
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: sh -n deploy/check.sh
      - run: >
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e STORE_DOMAIN=shop.example.com -e API_DOMAIN=api.shop.example.com -e ACME_EMAIL=you@example.com
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
