# Python lint, run in CI (`ruff check .`). The rules catch mistakes rather than enforce a
# style: unused or undefined names (F), statements that can't be right (E4, E7, E9) and
# likely bugs (B).
[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # FastAPI's Depends() in a default argument is how dependencies are declared
    "B008",
    # SQLAlchemy builds queries from `Column == None` and `Column == True`; `is` would
    # be evaluated by Python instead of becoming SQL
    "E711",
    "E712",
    # Short `if x: y` lines are used on purpose for runs of similar assignments
    "E701",
]
