server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite fingerprints these file names, so they can be cached for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path (/orders/abc, /admin, ...) loads index.html
    # and React Router takes it from there. Never cache index.html so deploys show up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
